dataset:
  train:
    _base_: cfgs/dataset/WHUUrban3DDataset.yaml
    others:
      bs: 2
      subset: train
      test_area: 5
      feature_mode: xyz
      K_FOLDS: 1
  val:
    _base_: cfgs/dataset/WHUUrban3DDataset.yaml
    others:
      bs: 2
      subset: val
      test_area: 5
      feature_mode: xyz
      K_FOLDS: 1
  # NEEDED FOR EVAL!
  test:
    _base_: cfgs/dataset/WHUUrban3DDataset.yaml
    others:
      bs: 2
      subset: test
      test_area: 5
      feature_mode: xyz
      K_FOLDS: 1

grad_norm_clip: 10
max_epoch: 300
step_per_update: 1

model: 
  channels: 3
  NAME: CurveNet_Seg
  seg_classes: 2
  num_obj_classes: 1
  use_cls_label: False
  k: 32  # 16 32

optimizer:
  type: AdamW
  kwargs:
    lr: 0.001  # 0.0003
    weight_decay: 0.0001

scheduler:
  type: CosLR
  kwargs:
    initial_epochs: 10


